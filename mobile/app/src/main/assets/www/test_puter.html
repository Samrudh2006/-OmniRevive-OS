<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Puter AI</title>
  <script src="https://js.puter.com/v2/"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #111; color: #fff;">
  <h1>Testing Puter.js AI</h1>
  <div id="status">Loading Puter...</div>
  <div id="output" style="margin-top: 20px; font-size: 16px; color: #10b981;"></div>

  <script>
    async function test() {
      const statusEl = document.getElementById("status");
      const outEl = document.getElementById("output");
      try {
        statusEl.innerText = "Calling puter.ai.chat()...";
        const resp = await puter.ai.chat("Answer in 1 sentence: What is 2 + 2 and who are you?", {
          model: "gpt-4o-mini"
        });
        statusEl.innerText = "SUCCESS!";
        outEl.innerText = typeof resp === "string" ? resp : (resp?.message?.content || JSON.stringify(resp));
        console.log("Puter result:", resp);
      } catch (err) {
        statusEl.innerText = "FAILED: " + err.message;
        console.error("Puter error:", err);
      }
    }
    window.addEventListener("DOMContentLoaded", test);
  </script>
</body>
</html>
