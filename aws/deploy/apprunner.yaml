version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install --upgrade pip
      - pip install -r requirements.txt
run:
  command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
    env: APP_PORT
  env:
    - name: ENVIRONMENT
      value: production
    - name: AWS_REGION
      value: ap-south-1
    - name: AWS_BEDROCK_MODEL
      value: anthropic.claude-3-5-sonnet-20241022-v2:0
